# Database configuration (Twelve-Factor: III - Config)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:quarkus}
quarkus.datasource.password=${DB_PASSWORD:quarkus}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/quarkusdb}

# Hibernate configuration
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway migrations (Twelve-Factor: XII - Admin Processes)
quarkus.flyway.locations=db/migration
quarkus.flyway.repair-at-start=true
# Em DEV: Automático para conveniência
%dev.quarkus.flyway.migrate-at-start=true
# Em PROD: Controlado via variável de ambiente (default: false)
%prod.quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:false}
# Em TEST: Automático
%test.quarkus.flyway.migrate-at-start=true

# HTTP configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Security configuration
quarkus.security.jdbc.enabled=true
quarkus.security.jdbc.principal-query.sql=SELECT u.password, p.name FROM users u JOIN user_profiles p ON u.profile_id = p.id WHERE u.email = ?
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.enabled=true
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.password-index=1
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.iteration-count-index=-1
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.salt-index=-1
quarkus.security.jdbc.principal-query.attribute-mappings.0.index=2
quarkus.security.jdbc.principal-query.attribute-mappings.0.to=groups

# Form-based authentication
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/users
quarkus.http.auth.permission.login.paths=/login
quarkus.http.auth.permission.login.methods=GET
quarkus.http.auth.permission.login.policy=permit
quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY:dev-key-change-in-prod-must-be-32-chars}

# Observability endpoints (health, metrics, openapi) - public access
quarkus.http.auth.permission.health.paths=/q/health,/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.metrics.paths=/q/metrics
quarkus.http.auth.permission.metrics.policy=permit
quarkus.http.auth.permission.openapi.paths=/q/openapi,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.openapi.policy=permit

quarkus.http.auth.permission.default.paths=/*
quarkus.http.auth.permission.default.policy=authenticated
quarkus.http.auth.permission.default.auth-mechanism=form

# Audit logging
quarkus.log.category."com.robsonbs.filter".level=DEBUG

# Graceful Shutdown (Twelve-Factor: IX - Disposability)
quarkus.shutdown.timeout=30s

# Logging Configuration (Twelve-Factor: XI - Logs)
# Em DEV: Texto simples para legibilidade
%dev.quarkus.log.console.json=false
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
# Em PROD: JSON estruturado para máquinas
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.pretty-print=false
%prod.quarkus.log.level=INFO

# =============================================================================
# FIFTEEN-FACTOR XIII: API First - OpenAPI/Swagger
# =============================================================================
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true

# Metadata da API
quarkus.smallrye-openapi.info-title=Quarkus Test API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de Gestão de Usuários, Notas e Tarefas
quarkus.smallrye-openapi.info-contact-name=Robson BS
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.info-license-url=https://opensource.org/licenses/MIT

# =============================================================================
# FIFTEEN-FACTOR XIV: Telemetry - Health Checks
# =============================================================================
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

# =============================================================================
# FIFTEEN-FACTOR XIV: Telemetry - Métricas Prometheus
# =============================================================================
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true

# =============================================================================
# FIFTEEN-FACTOR XV: Security - Headers e CORS
# =============================================================================
# Previne MIME type sniffing
quarkus.http.header."X-Content-Type-Options".value=nosniff

# Previne clickjacking
quarkus.http.header."X-Frame-Options".value=SAMEORIGIN

# Proteção XSS (legacy browsers)
quarkus.http.header."X-XSS-Protection".value=1; mode=block

# Política de referrer
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

# Restringe funcionalidades do browser
quarkus.http.header."Permissions-Policy".value=geolocation=(), microphone=(), camera=()

# Content Security Policy
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self' 'unsafe-inline' cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdn.tailwindcss.com; font-src 'self' fonts.gstatic.com; img-src 'self' data:;

# HSTS - apenas em produção com HTTPS
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Request-ID,Accept
quarkus.http.cors.exposed-headers=X-Request-ID
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true
