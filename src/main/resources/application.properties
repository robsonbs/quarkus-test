# Database configuration (Twelve-Factor: III - Config)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:quarkus}
quarkus.datasource.password=${DB_PASSWORD:quarkus}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/quarkusdb}

# Hibernate configuration
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway migrations (Twelve-Factor: XII - Admin Processes)
quarkus.flyway.locations=db/migration
quarkus.flyway.repair-at-start=true
# Em DEV: Automático para conveniência
%dev.quarkus.flyway.migrate-at-start=true
# Em PROD: Controlado via variável de ambiente (default: false)
%prod.quarkus.flyway.migrate-at-start=${FLYWAY_MIGRATE_AT_START:false}
# Em TEST: Automático
%test.quarkus.flyway.migrate-at-start=true

# HTTP configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Security configuration
quarkus.security.jdbc.enabled=true
quarkus.security.jdbc.principal-query.sql=SELECT u.password, p.name FROM users u JOIN user_profiles p ON u.profile_id = p.id WHERE u.email = ?
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.enabled=true
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.password-index=1
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.iteration-count-index=-1
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.salt-index=-1
quarkus.security.jdbc.principal-query.attribute-mappings.0.index=2
quarkus.security.jdbc.principal-query.attribute-mappings.0.to=groups

# Form-based authentication
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/users
quarkus.http.auth.permission.login.paths=/login
quarkus.http.auth.permission.login.methods=GET
quarkus.http.auth.permission.login.policy=permit
quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY:dev-key-change-in-prod-must-be-32-chars}
quarkus.http.auth.permission.default.paths=/*
quarkus.http.auth.permission.default.policy=authenticated
quarkus.http.auth.permission.default.auth-mechanism=form

# Audit logging
quarkus.log.category."com.robsonbs.filter".level=DEBUG

# Graceful Shutdown (Twelve-Factor: IX - Disposability)
quarkus.shutdown.timeout=30s

# Logging Configuration (Twelve-Factor: XI - Logs)
# Em DEV: Texto simples para legibilidade
%dev.quarkus.log.console.json=false
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
# Em PROD: JSON estruturado para máquinas
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.pretty-print=false
%prod.quarkus.log.level=INFO
