<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{#if user}Editar Usuário{#else}Novo Usuário{/if} - Quarkus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    {@include includes/navigation.html}
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            {@include includes/breadcrumb.html}
            {@include includes/flash.html}
            <!-- Back Button -->
            <div class="mb-6">
                <a href="/users" class="inline-flex items-center text-blue-600 hover:text-blue-800 transition duration-150">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    Voltar para Usuários
                </a>
            </div>

            <!-- Form Card -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="px-6 py-4 bg-gray-50 border-b border-gray-200">
                    <h2 class="text-2xl font-bold text-gray-800">
                        {#if user}
                            Editar Usuário
                        {#else}
                            Criar Novo Usuário
                        {/if}
                    </h2>
                </div>

                <div class="p-6">
                    <form method="post" action="{#if user}/users/{user.id}{#else}/users{/if}" class="space-y-6">
                        <!-- Name Field -->
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                Nome <span class="text-red-500">*</span>
                            </label>
                            <input
                                type="text"
                                id="name"
                                name="name"
                                value="{initialName ?: ''}"
                                required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150"
                                placeholder="Digite o nome do usuário"
                            >
                        </div>

                        <!-- Email Field -->
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                                Email <span class="text-red-500">*</span>
                            </label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                value="{initialEmail ?: ''}"
                                required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150"
                                placeholder="usuario@exemplo.com"
                            >
                        </div>

                        <!-- Password Field -->
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                                Senha {#if user}(deixe em branco para manter){#else}<span class="text-red-500">*</span>{/if}
                            </label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150"
                                placeholder="••••••"
                                {#if !user}required{/if}
                            >
                        </div>

                        <!-- Profile Field -->
                        <div>
                            <label for="profileId" class="block text-sm font-medium text-gray-700 mb-2">
                                Perfil <span class="text-red-500">*</span>
                            </label>
                            <select
                                id="profileId"
                                name="profileId"
                                required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150"
                            >
                                <option value="" disabled {#if !hasSelectedProfile}selected{/if}>Selecione um perfil</option>
                                {#for profile in profiles}
                                <option value="{profile.id}" {#if selectedProfileId == profile.id?string}selected{/if}>{profile.name}</option>
                                {/for}
                            </select>
                        </div>

                        <!-- Buttons -->
                        <div class="flex items-center justify-end space-x-4 pt-4">
                            <a href="/users" 
                               class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition duration-150">
                                Cancelar
                            </a>
                            <button 
                                type="submit" 
                                class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200 shadow-md hover:shadow-lg">
                                {#if user}
                                    Atualizar Usuário
                                {#else}
                                    Criar Usuário
                                {/if}
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Info Card -->
            <div class="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-blue-800">Nota</h3>
                        <div class="mt-2 text-sm text-blue-700">
                            <p>Todos os campos marcados com <span class="text-red-500">*</span> são obrigatórios.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
