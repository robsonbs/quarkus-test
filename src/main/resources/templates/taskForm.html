<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{#if task}Editar tarefa{#else}Nova tarefa{/if} • Quarkus Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    {#navigation /}
    <div class="container mx-auto px-4 py-8">
      <div class="max-w-3xl mx-auto">
        {#breadcrumb /}
        {#flash /}

        <div class="bg-white rounded-lg shadow-md p-8">
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">
              {#if task}Editar tarefa{#else}Nova tarefa{/if}
            </h1>
            <p class="text-gray-600 text-sm mt-2">
              Informe título, prazo e status para controlar suas atividades.
            </p>
          </div>

          <form method="post" action="/tasks{#if task}/{task.id}{/if}" class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2" for="title">
                Título
              </label>
              <input
                id="title"
                name="title"
                type="text"
                required
                value="{initialTitle ?: ''}"
                class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                placeholder="Ex: Preparar apresentação"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2" for="description">
                Descrição
              </label>
              <textarea
                id="description"
                name="description"
                rows="4"
                class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                placeholder="Detalhes adicionais, checklist, links etc."
              >{initialDescription ?: ''}</textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="dueDate">
                  Data limite
                </label>
                <input
                  id="dueDate"
                  name="dueDate"
                  type="date"
                  value="{initialDueDate ?: ''}"
                  class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="status">
                  Status
                </label>
                <select
                  id="status"
                  name="status"
                  class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                >
                  {#for item in statuses}
                  <option value="{item.name}" {#if initialStatus == item.name}selected{/if}>
                    {#if item.name == 'PENDING'}Pendente{/if}
                    {#if item.name == 'IN_PROGRESS'}Em andamento{/if}
                    {#if item.name == 'COMPLETED'}Concluída{/if}
                  </option>
                  {/for}
                </select>
              </div>
            </div>

            <div class="flex items-center justify-between">
              <a
                href="/tasks"
                class="text-sm text-gray-600 hover:text-gray-900 transition"
              >
                Voltar para a lista
              </a>
              <button
                type="submit"
                class="inline-flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
              >
                {#if task}Atualizar tarefa{#else}Salvar tarefa{/if}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
